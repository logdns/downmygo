name: Build

# Builds the installers of every platform and uploads them to the release
# of the tag, as a draft to publish. Run it by hand to get the artifacts
# of a branch without a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # the draft release, and the uploads to it

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The macOS app is built on macOS: the .app bundle, the ad hoc
          # signature and the disk image need it. Set macos.signingIdentity
          # and macos.notarize in mygo.json to ship it outside the Mac App
          # Store.
          - { name: macOS, os: macos-latest, platform: "darwin/universal" }
          # MyGo needs no cgo, so Ubuntu builds the Windows and the Linux
          # apps as well as their own runners would.
          - { name: Windows, os: ubuntu-latest, platform: "windows/amd64,windows/arm64" }
          - { name: Linux, os: ubuntu-latest, platform: "linux/amd64,linux/arm64" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install NSIS, for the Windows installers
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Build
        run: go tool mygo build -platform "${{ matrix.platform }}"
      - uses: actions/upload-artifact@v7
        with:
          name: downmygo-${{ matrix.name }}
          path: build/
          if-no-files-found: error

  release:
    name: Draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Collect the installers
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release
          cp artifacts/downmygo-macOS/darwin-universal/*.dmg release/
          for arch in amd64 arm64; do
            # The installers are named after the version and the
            # architecture already; the bare app needs both added, as two
            # platforms would otherwise upload the same name.
            cp artifacts/downmygo-Windows/windows-$arch/downmygo-setup-*.exe release/
            cp artifacts/downmygo-Windows/windows-$arch/downmygo.exe \
               "release/downmygo-$version-windows-$arch.exe"
            cp artifacts/downmygo-Linux/linux-$arch/*.deb release/
            cp artifacts/downmygo-Linux/linux-$arch/*.tar.gz release/
          done
          ls -l release
      - name: Upload the installers to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "$tag" --generate-notes
          fi
          gh release upload "$tag" release/* --repo "$GITHUB_REPOSITORY" --clobber
