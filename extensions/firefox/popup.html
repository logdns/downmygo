<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>downmygo</title>
  <style>
    :root { color-scheme: light dark; --bg:#fff; --ink:#10131a; --muted:#667085; --line:#e3e7ef; --accent:#3b6ef6; --ok:#12b76a; --bad:#d92d20; }
    @media (prefers-color-scheme: dark) { :root { --bg:#171b22; --ink:#edf1f7; --muted:#98a2b3; --line:#262c36; --accent:#6e93ff; } }
    * { box-sizing: border-box; }
    body { width: 340px; margin: 0; padding: 14px; background: var(--bg); color: var(--ink);
           font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .logo { width: 26px; height: 26px; border-radius: 8px; background: linear-gradient(135deg, #4a78ff, #0fa79a);
            display: grid; place-items: center; color: #fff; font-weight: 800; }
    h1 { font-size: 14px; margin: 0; }
    .state { margin-left: auto; font-size: 11px; color: var(--muted); }
    .state.ok { color: var(--ok); }
    .state.bad { color: var(--bad); }
    input[type=text] { width: 100%; padding: 8px; border: 1px solid var(--line); border-radius: 8px;
                       background: transparent; color: inherit; font: inherit; }
    button { width: 100%; margin-top: 8px; padding: 9px; border: 0; border-radius: 8px;
             background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
    label { display: flex; align-items: center; gap: 8px; margin-top: 12px; color: var(--muted); font-size: 12px; }
    p { margin: 10px 0 0; color: var(--muted); font-size: 11px; }
    code { font-size: 10px; }
  </style>
</head>
<body>
  <header>
    <div class="logo">d</div>
    <h1>downmygo</h1>
    <span class="state" id="state">…</span>
  </header>
  <input id="url" type="text" placeholder="https://example.com/file.zip" spellcheck="false">
  <button id="send">Send to downmygo</button>
  <button id="grab" class="ghost">Grab the links of this page</button>
  <label><input id="takeover" type="checkbox"> Take over the browser's downloads</label>
  <p id="note"></p>
  <script src="popup.js"></script>
</body>
</html>
